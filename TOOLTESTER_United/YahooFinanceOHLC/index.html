<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYOK Multi-Model Backtester</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>BYOK Multi-Model Backtester</h1>
            <p class="subtitle">Normalize disparate financial APIs and evaluate the Gordon Growth Model in real-time</p>
        </header>
        
        <div class="control-panel">
            <div class="input-row">
                <div class="input-group">
                    <label for="provider">Data Provider</label>
                    <select id="provider">
                        <option value="yahoofinance" selected>Yahoo Finance (Free, No Key Required)</option>
                        <option value="arpan_api">Arpan Market API (BYOK)</option>
                        <option value="alphavantage">Alpha Vantage</option>
                        <option value="fmp">Financial Modeling Prep (FMP)</option>
                        <option value="finnhub">Finnhub (Global)</option>
                        <option value="twelvedata">Twelve Data (Global)</option>
                        <option value="alpaca">Alpaca (US Only)</option>
                    </select>
                </div>
                
                <div class="input-group" id="apiKeyGroup">
                    <label for="apiKey">API Key</label>
                    <input type="password" id="apiKey" placeholder="Not required for Yahoo Finance" disabled>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="ticker">Ticker Symbol</label>
                    <input type="text" id="ticker" value="JNJ" placeholder="e.g. JNJ, AAPL, MSFT">
                </div>
                
                <div class="input-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate" value="2019-01-01">
                </div>
                
                <div class="input-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate" value="2024-01-01">
                </div>
            </div>

            <div class="input-row models-config">
                <div class="input-group">
                    <label for="reqReturn">Required Return (r)</label>
                    <input type="number" id="reqReturn" value="0.08" step="0.005" min="0.01" max="0.50">
                </div>
            </div>

            <button id="executeBtn" class="primary-btn">Fetch & Execute Model</button>
        </div>

        <div id="statusMessage" class="status-msg"></div>

        <!-- Metrics Dashboard -->
        <div class="metrics-grid" id="metricsGrid" style="display: none;">
            <div class="metric-card">
                <div class="metric-label">Average Close Price</div>
                <div class="metric-value" id="metricAvgClose">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Total Dividends Paid</div>
                <div class="metric-value" id="metricTotalDiv">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Assumed Growth (g)</div>
                <div class="metric-value" id="metricGrowth">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Avg GGM Intrinsic Value</div>
                <div class="metric-value" id="metricAvgGGM">-</div>
            </div>
        </div>

        <!-- Chart Visualization Card -->
        <div class="chart-card" id="chartCard" style="display: none;">
            <h3>Model Convergence: Market Close vs GGM Value</h3>
            <div class="chart-container">
                <canvas id="convergenceChart"></canvas>
            </div>
        </div>
        
        <div class="table-container" id="resultsTableContainer" style="display: none;">
            <h3>Historical Timeline & Valuation Results</h3>
            <table id="dataTable">
                <thead>
                    <tr id="tableHeaders"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="providers.js"></script>
    <script src="app.js"></script>
</body>
</html>
